<svg width="400" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="350" fill="#f9fafb"/>
  
  <!-- Borde del kiosco -->
  <rect x="5" y="5" width="390" height="340" fill="none" stroke="#374151" stroke-width="3" rx="8"/>
  
  <!-- Header -->
  <rect x="15" y="15" width="370" height="40" fill="#e5e7eb" stroke="#9ca3af" rx="4"/>
  <text x="25" y="40" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold">Tipo de Pedido</text>
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Pedido #12345</text>
  
  <!-- Título -->
  <text x="15" y="75" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Seleccione una opción:</text>
  
  <!-- Botón Consumir aquí (seleccionado) -->
  <rect x="15" y="85" width="175" height="80" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <circle cx="100" y="115" r="20" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="85" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Icono</text>
  <text x="65" y="150" font-family="Arial, sans-serif" font-size="10" fill="#374151" font-weight="bold">Consumir aquí</text>
  <text x="60" y="162" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">En el restaurante</text>
  
  <!-- Botón Para llevar -->
  <rect x="200" y="85" width="185" height="80" fill="white" stroke="#d1d5db" rx="8"/>
  <circle cx="295" y="115" r="20" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="280" y="120" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Icono</text>
  <text x="260" y="150" font-family="Arial, sans-serif" font-size="10" fill="#374151" font-weight="bold">Para llevar</text>
  <text x="250" y="162" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Salir del restaurante</text>
  
  <!-- Sección Mesa -->
  <text x="15" y="190" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Número de Mesa:</text>
  
  <!-- Grid de mesas -->
  <rect x="15" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="28" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">1</text>
  
  <rect x="55" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="68" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">2</text>
  
  <rect x="95" y="200" width="35" height="30" fill="#3b82f6" stroke="#2563eb" rx="4"/>
  <text x="108" y="220" font-family="Arial, sans-serif" font-size="10" fill="white">3</text>
  
  <rect x="135" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="148" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">4</text>
  
  <rect x="175" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="188" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">5</text>
  
  <rect x="215" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="228" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">6</text>
  
  <rect x="255" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="268" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">7</text>
  
  <rect x="295" y="200" width="35" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="308" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">8</text>
  
  <!-- Campo de entrada manual -->
  <rect x="15" y="240" width="250" height="30" fill="white" stroke="#d1d5db" rx="4"/>
  <text x="25" y="260" font-family="Arial, sans-serif" font-size="9" fill="#9ca3af" font-style="italic">O ingrese número manualmente</text>
  
  <!-- Botón Continuar -->
  <rect x="275" y="240" width="110" height="30" fill="#3b82f6" stroke="#2563eb" rx="4"/>
  <text x="305" y="260" font-family="Arial, sans-serif" font-size="10" fill="white">Continuar</text>
  
  <!-- Nota -->
  <rect x="15" y="285" width="370" height="50" fill="#f3f4f6" stroke="#e5e7eb" rx="4"/>
  <text x="25" y="305" font-family="Arial, sans-serif" font-size="8" fill="#6b7280" font-style="italic">Seleccionar tipo de pedido antes de continuar.</text>
  <text x="25" y="320" font-family="Arial, sans-serif" font-size="8" fill="#6b7280" font-style="italic">Si es "Consumir aquí", seleccionar número de mesa.</text>
</svg>