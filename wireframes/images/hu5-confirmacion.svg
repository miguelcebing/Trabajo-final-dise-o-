<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="400" fill="#f9fafb"/>
  
  <!-- Borde del kiosco -->
  <rect x="5" y="5" width="390" height="390" fill="none" stroke="#374151" stroke-width="3" rx="8"/>
  
  <!-- Header -->
  <rect x="15" y="15" width="370" height="40" fill="#e5e7eb" stroke="#9ca3af" rx="4"/>
  <text x="25" y="40" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold">Resumen del Pedido</text>
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Pedido #12345</text>
  
  <!-- Tipo de pedido -->
  <text x="15" y="75" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Tipo: Consumir aquí - Mesa 3</text>
  
  <!-- Lista de productos -->
  <rect x="15" y="85" width="220" height="140" fill="white" stroke="#d1d5db" rx="4"/>
  
  <!-- Producto 1 -->
  <text x="25" y="105" font-family="Arial, sans-serif" font-size="9" fill="#374151">Hamburguesa Clásica (Mediana) x1</text>
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="9" fill="#374151">$8.99</text>
  <line x1="25" y1="110" x2="225" y2="110" stroke="#e5e7eb"/>
  
  <!-- Producto 2 -->
  <text x="25" y="130" font-family="Arial, sans-serif" font-size="9" fill="#374151">Ensalada César x2</text>
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="9" fill="#374151">$14.98</text>
  <line x1="25" y1="135" x2="225" y2="135" stroke="#e5e7eb"/>
  
  <!-- Producto 3 -->
  <text x="25" y="155" font-family="Arial, sans-serif" font-size="9" fill="#374151">Bebida (Cola) x1</text>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="9" fill="#374151">$1.50</text>
  <line x1="25" y1="160" x2="225" y2="160" stroke="#e5e7eb"/>
  
  <!-- Panel de totales -->
  <rect x="250" y="85" width="135" height="140" fill="white" stroke="#d1d5db" rx="4"/>
  
  <text x="260" y="110" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Subtotal:</text>
  <text x="340" y="110" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">$25.47</text>
  
  <text x="260" y="130" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">IVA (16%):</text>
  <text x="340" y="130" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">$4.08</text>
  
  <line x1="260" y1="140" x2="370" y2="140" stroke="#d1d5db"/>
  
  <text x="260" y="160" font-family="Arial, sans-serif" font-size="10" fill="#374151" font-weight="bold">Total:</text>
  <text x="320" y="160" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold">$29.55</text>
  
  <!-- Botones de acción -->
  <rect x="15" y="240" width="185" height="35" fill="white" stroke="#ef4444" rx="4"/>
  <text x="55" y="262" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">Cancelar Pedido</text>
  
  <rect x="210" y="240" width="175" height="35" fill="#22c55e" stroke="#16a34a" rx="4"/>
  <text x="245" y="262" font-family="Arial, sans-serif" font-size="10" fill="white">Confirmar Pedido</text>
  
  <!-- Mensaje de confirmación (preview) -->
  <rect x="15" y="290" width="370" height="100" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/>
  <circle cx="200" y="320" r="15" fill="#dcfce7" stroke="#22c55e"/>
  <text x="195" y="325" font-family="Arial, sans-serif" font-size="12" fill="#22c55e">✓</text>
  <text x="140" y="350" font-family="Arial, sans-serif" font-size="11" fill="#166534" font-weight="bold">¡Pedido Recibido!</text>
  <text x="130" y="370" font-family="Arial, sans-serif" font-size="9" fill="#166534">Tiempo estimado: 15 minutos</text>
</svg>