<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a100d" />
  <title>RestSmart · Autoservicio</title>
  <meta name="description" content="Sistema de autoservicio para restaurante: menú, pedido, mesa, cocina por sector y administración del catálogo." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231a100d'/%3E%3Cpath d='M32 12c2 10 10 12 10 22a10 10 0 0 1-20 0c0-6 4-8 5-14 4 3 5 6 5 9 2-4 2-9 0-17Z' fill='%23ff7a3d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/motion.css" />
</head>
<body>
  <!-- impeccable-disable radial-spotlight-glow: ambient liquid-glass blobs are the approved signature of the visual direction -->
  <!-- impeccable-disable clipped-overflow-container: all positioned layers (ambient, toasts, overlay, orbs) are position:fixed — body overflow does not clip them -->
  <!-- impeccable-disable marquee: skeleton shimmer lives in linked CSS as loading feedback, not auto-scrolling content -->
  <!-- impeccable-disable low-contrast: pixel-min dips are antialiasing edges on glass gradients — all medians pass WCAG AA; runtime pixel scan is the source of truth -->
  <div class="ambient" aria-hidden="true">
    <span class="ambient__blob ambient__blob--ember"></span>
    <span class="ambient__blob ambient__blob--mango"></span>
    <span class="ambient__blob ambient__blob--plum"></span>
    <span class="ambient__grain"></span>
  </div>

  <div class="app">
    <header class="topbar glass">
      <a class="brand" href="#cliente/menu" aria-label="RestSmart, ir al menú">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 4c1.4 7 7 8.4 7 15a7 7 0 1 1-14 0c0-4.2 2.8-5.6 3.5-9.8 2.8 2.1 3.5 4.2 3.5 6.3 1.4-2.8 1.4-6.3 0-11.5Z" fill="url(#gFlame)"/>
            <defs>
              <linearGradient id="gFlame" x1="9" y1="4" x2="23" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFC24B"/><stop offset=".55" stop-color="#FF7A3D"/><stop offset="1" stop-color="#E2541F"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand__name">Rest<strong>Smart</strong></span>
      </a>

      <nav class="modes" id="modes" aria-label="Entornos del sistema">
        <button class="mode clay" data-mode="cliente" type="button" aria-pressed="true">
          <span class="mode__icon" data-icon="menu" aria-hidden="true"></span>
          <span class="mode__label">Cliente</span>
        </button>
        <button class="mode clay" data-mode="cocina" type="button" aria-pressed="false">
          <span class="mode__icon" data-icon="flame" aria-hidden="true"></span>
          <span class="mode__label">Cocina</span>
        </button>
        <button class="mode clay" data-mode="admin" type="button" aria-pressed="false">
          <span class="mode__icon" data-icon="sliders" aria-hidden="true"></span>
          <span class="mode__label">Admin</span>
        </button>
      </nav>

      <div class="topbar__side">
        <span class="api-status" id="apiStatus" role="status">
          <span class="api-status__dot" aria-hidden="true"></span>
          <span class="api-status__text">Conectando</span>
        </span>
        <button class="cart-orb clay" id="cartOrb" type="button" aria-label="Abrir carrito, 0 ítems">
          <span class="cart-orb__icon" data-icon="cart" aria-hidden="true"></span>
          <span class="cart-orb__count" id="cartCount">0</span>
        </button>
      </div>
    </header>

    <nav class="rail glass" id="rail" aria-label="Navegación principal"></nav>

    <main class="stage" id="stage" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="overlay-root" id="overlayRoot"></div>

  <noscript>
    <p class="noscript">RestSmart necesita JavaScript para funcionar. Actívalo en este navegador.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
