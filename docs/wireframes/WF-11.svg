<rect x="480" y="440" width="420" height="120" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="494" y="468" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Recoge tu pedido en el punto de entrega</text>
