<rect x="24" y="360" width="540" height="100" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="38" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Método</text><text x="38" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">Pago en pantalla (simulado)</text>
