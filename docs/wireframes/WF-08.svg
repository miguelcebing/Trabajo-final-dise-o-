<rect x="592" y="140" width="308" height="200" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="606" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Estado</text><text x="606" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">Procesando pago…</text>
<rect x="592" y="360" width="308" height="100" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="606" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Resultado</text><text x="606" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#666666" text-anchor="start">Pago aprobado</text>
<rect x="940" y="96" width="316" height="600" fill="#FBFBFB" stroke="#CCCCCC" stroke-width="1.5"/>
<text x="958" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="start">Anotaciones (criterios CA)</text>
