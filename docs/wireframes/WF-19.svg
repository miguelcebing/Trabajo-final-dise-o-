<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Disponibilidad de productos">
<rect width="1280" height="720" fill="#FFFFFF"/>
