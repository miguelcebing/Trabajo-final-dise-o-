<text x="48" y="320" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="start">1 x Brownie con helado</text><text x="48" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#666666" text-anchor="start">$14.000</text>
