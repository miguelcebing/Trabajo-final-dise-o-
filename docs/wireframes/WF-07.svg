<text x="48" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="start">2 x Bandeja paisa</text><text x="48" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#666666" text-anchor="start">$64.000</text>
