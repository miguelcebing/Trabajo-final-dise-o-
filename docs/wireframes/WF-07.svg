<rect x="592" y="320" width="308" height="140" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="606" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Mesa 5 · Cliente: Ana</text>
<rect x="592" y="600" width="308" height="80" rx="10" fill="#2B2B2B"/><text x="746.0" y="646.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PAGAR</text>
<rect x="24" y="620" width="240" height="80" rx="10" fill="#E4E4E4" stroke="#9E9E9E" stroke-width="1.5"/><text x="144.0" y="666.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Cancelar pedido</text>
<rect x="940" y="96" width="316" height="600" fill="#FBFBFB" stroke="#CCCCCC" stroke-width="1.5"/>
<text x="958" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="start">Anotaciones (criterios CA)</text>
<circle cx="966" cy="163" r="13" fill="#2B2B2B"/>
<text x="966" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="988" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">CA-1 Ítems con cantidad</text>
<text x="988" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">y precio.</text>
<circle cx="966" cy="219" r="13" fill="#2B2B2B"/>
<text x="966" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="988" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">CA-1 Subtotal y total</text>
<text x="988" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">del pedido.</text>
