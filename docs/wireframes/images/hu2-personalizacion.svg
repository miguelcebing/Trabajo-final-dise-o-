<svg width="400" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="350" fill="#f9fafb"/>
  
  <!-- Borde del kiosco -->
  <rect x="5" y="5" width="390" height="340" fill="none" stroke="#374151" stroke-width="3" rx="8"/>
  
  <!-- Header -->
  <rect x="15" y="15" width="370" height="40" fill="#e5e7eb" stroke="#9ca3af" rx="4"/>
  <text x="25" y="40" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold">Personalizar: Hamburguesa Clásica</text>
  
  <!-- Botón cerrar -->
  <rect x="355" y="22" width="25" height="25" fill="#ef4444" stroke="#dc2626" rx="4"/>
  <text x="363" y="40" font-family="Arial, sans-serif" font-size="12" fill="white">X</text>
  
  <!-- Sección Tamaño -->
  <text x="15" y="75" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Tamaño:</text>
  
  <rect x="15" y="85" width="70" height="28" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="28" y="103" font-family="Arial, sans-serif" font-size="9" fill="#374151">Pequeña</text>
  
  <rect x="95" y="85" width="70" height="28" fill="#3b82f6" stroke="#2563eb" rx="4"/>
  <text x="108" y="103" font-family="Arial, sans-serif" font-size="9" fill="white">Mediana</text>
  
  <rect x="175" y="85" width="70" height="28" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="195" y="103" font-family="Arial, sans-serif" font-size="9" fill="#374151">Grande</text>
  
  <!-- Sección Ingredientes -->
  <text x="15" y="135" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Ingredientes:</text>
  
  <!-- Checkboxes ingredientes -->
  <rect x="15" y="145" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <rect x="17" y="147" width="8" height="8" fill="#3b82f6"/>
  <text x="32" y="155" font-family="Arial, sans-serif" font-size="9" fill="#374151">Lechuga</text>
  
  <rect x="95" y="145" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <rect x="97" y="147" width="8" height="8" fill="#3b82f6"/>
  <text x="112" y="155" font-family="Arial, sans-serif" font-size="9" fill="#374151">Tomate</text>
  
  <rect x="175" y="145" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <text x="192" y="155" font-family="Arial, sans-serif" font-size="9" fill="#374151">Cebolla</text>
  
  <rect x="15" y="165" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <rect x="17" y="167" width="8" height="8" fill="#3b82f6"/>
  <text x="32" y="175" font-family="Arial, sans-serif" font-size="9" fill="#374151">Queso</text>
  
  <rect x="95" y="165" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <rect x="97" y="167" width="8" height="8" fill="#3b82f6"/>
  <text x="112" y="175" font-family="Arial, sans-serif" font-size="9" fill="#374151">Carne</text>
  
  <rect x="175" y="165" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <rect x="177" y="167" width="8" height="8" fill="#3b82f6"/>
  <text x="192" y="175" font-family="Arial, sans-serif" font-size="9" fill="#374151">Mostaza</text>
  
  <!-- Sección Complementos -->
  <text x="15" y="205" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Complementos:</text>
  
  <rect x="15" y="215" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <text x="32" y="225" font-family="Arial, sans-serif" font-size="9" fill="#374151">Papas Fritas +$2.00</text>
  
  <rect x="15" y="235" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <text x="32" y="245" font-family="Arial, sans-serif" font-size="9" fill="#374151">Bebida +$1.50</text>
  
  <rect x="15" y="255" width="12" height="12" fill="white" stroke="#9ca3af"/>
  <text x="32" y="265" font-family="Arial, sans-serif" font-size="9" fill="#374151">Ensalada Extra +$3.00</text>
  
  <!-- Panel de resumen -->
  <rect x="250" y="135" width="135" height="100" fill="white" stroke="#d1d5db" rx="4"/>
  <text x="260" y="155" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Resumen:</text>
  <rect x="260" y="165" width="115" height="40" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <text x="260" y="225" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Precio Actual:</text>
  <text x="340" y="225" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold">$8.99</text>
  
  <!-- Botón Agregar al Carrito -->
  <rect x="250" y="245" width="135" height="35" fill="#22c55e" stroke="#16a34a" rx="4"/>
  <text x="275" y="267" font-family="Arial, sans-serif" font-size="10" fill="white">Agregar al Carrito</text>
  
  <!-- Línea separadora -->
  <line x1="15" y1="290" x2="385" y2="290" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Nota inferior -->
  <text x="15" y="310" font-family="Arial, sans-serif" font-size="8" fill="#9ca3af" font-style="italic">Los checkboxes actualizan el precio en tiempo real</text>
</svg>