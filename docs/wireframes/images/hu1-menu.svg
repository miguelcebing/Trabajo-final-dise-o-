<svg width="400" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="350" fill="#f9fafb"/>
  
  <!-- Borde del kiosco -->
  <rect x="5" y="5" width="390" height="340" fill="none" stroke="#374151" stroke-width="3" rx="8"/>
  
  <!-- Header -->
  <rect x="15" y="15" width="370" height="45" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1" rx="4"/>
  <text x="25" y="43" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold">SISTEMA DE PEDIDOS - RESTAURANTE</text>
  
  <!-- Logo placeholder -->
  <circle cx="365" y="37" r="15" fill="#d1d5db" stroke="#9ca3af"/>
  
  <!-- Título Categorías -->
  <text x="15" y="80" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Categorías:</text>
  
  <!-- Botones de categoría -->
  <rect x="15" y="90" width="85" height="30" fill="#9ca3af" stroke="#6b7280" rx="4"/>
  <text x="32" y="110" font-family="Arial, sans-serif" font-size="9" fill="white">Bebidas</text>
  
  <rect x="110" y="90" width="85" height="30" fill="#9ca3af" stroke="#6b7280" rx="4"/>
  <text x="120" y="110" font-family="Arial, sans-serif" font-size="9" fill="white">Platos Fuertes</text>
  
  <rect x="205" y="90" width="85" height="30" fill="#9ca3af" stroke="#6b7280" rx="4"/>
  <text x="228" y="110" font-family="Arial, sans-serif" font-size="9" fill="white">Postres</text>
  
  <rect x="300" y="90" width="85" height="30" fill="#9ca3af" stroke="#6b7280" rx="4"/>
  <text x="320" y="110" font-family="Arial, sans-serif" font-size="9" fill="white">Especiales</text>
  
  <!-- Título Menú -->
  <text x="15" y="145" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Menú - Platos Fuertes:</text>
  
  <!-- Grid de productos - Fila 1 -->
  <!-- Producto 1 -->
  <rect x="15" y="155" width="85" height="100" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <rect x="20" y="160" width="75" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="20" y="210" width="60" height="8" fill="#d1d5db" rx="2"/>
  <rect x="20" y="222" width="40" height="8" fill="#d1d5db" rx="2"/>
  <rect x="20" y="234" width="25" height="8" fill="#d1d5db" rx="2"/>
  
  <!-- Producto 2 -->
  <rect x="110" y="155" width="85" height="100" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <rect x="115" y="160" width="75" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="115" y="210" width="60" height="8" fill="#d1d5db" rx="2"/>
  <rect x="115" y="222" width="40" height="8" fill="#d1d5db" rx="2"/>
  <rect x="115" y="234" width="25" height="8" fill="#d1d5db" rx="2"/>
  
  <!-- Producto 3 -->
  <rect x="205" y="155" width="85" height="100" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <rect x="210" y="160" width="75" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="210" y="210" width="60" height="8" fill="#d1d5db" rx="2"/>
  <rect x="210" y="222" width="40" height="8" fill="#d1d5db" rx="2"/>
  <rect x="210" y="234" width="25" height="8" fill="#d1d5db" rx="2"/>
  
  <!-- Producto 4 -->
  <rect x="300" y="155" width="85" height="100" fill="white" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <rect x="305" y="160" width="75" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="305" y="210" width="60" height="8" fill="#d1d5db" rx="2"/>
  <rect x="305" y="222" width="40" height="8" fill="#d1d5db" rx="2"/>
  <rect x="305" y="234" width="25" height="8" fill="#d1d5db" rx="2"/>
  
  <!-- Footer -->
  <rect x="15" y="270" width="370" height="35" fill="#f3f4f6" stroke="#d1d5db" rx="4"/>
  <text x="25" y="292" font-family="Arial, sans-serif" font-size="9" fill="#6b7280">Disponibilidad en tiempo real</text>
  
  <!-- Botón Seleccionar -->
  <rect x="300" y="275" width="75" height="25" fill="#3b82f6" stroke="#2563eb" rx="4"/>
  <text x="315" y="292" font-family="Arial, sans-serif" font-size="9" fill="white">Seleccionar</text>
  
  <!-- Indicador de selección -->
  <rect x="15" y="260" width="85" height="5" fill="#3b82f6" rx="2"/>
</svg>