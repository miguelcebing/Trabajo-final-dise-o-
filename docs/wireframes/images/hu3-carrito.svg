<svg width="400" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="400" height="350" fill="#f9fafb"/>
  
  <!-- Borde del kiosco -->
  <rect x="5" y="5" width="390" height="340" fill="none" stroke="#374151" stroke-width="3" rx="8"/>
  
  <!-- Header -->
  <rect x="15" y="15" width="370" height="40" fill="#e5e7eb" stroke="#9ca3af" rx="4"/>
  <text x="25" y="40" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold">Mi Carrito</text>
  <text x="340" y="40" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">3 items</text>
  
  <!-- Producto 1 -->
  <rect x="15" y="65" width="370" height="55" fill="white" stroke="#d1d5db" rx="4"/>
  <rect x="20" y="70" width="45" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="75" y="70" width="120" height="8" fill="#d1d5db" rx="2"/>
  <rect x="75" y="83" width="80" height="8" fill="#d1d5db" rx="2"/>
  <text x="75" y="105" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Hamburguesa Clásica (Mediana)</text>
  
  <!-- Controles cantidad producto 1 -->
  <rect x="250" y="75" width="20" height="20" fill="#d1d5db" stroke="#9ca3af" rx="2"/>
  <text x="257" y="90" font-family="Arial, sans-serif" font-size="10" fill="#374151">-</text>
  <rect x="275" y="75" width="25" height="20" fill="white" stroke="#9ca3af" rx="2"/>
  <text x="285" y="90" font-family="Arial, sans-serif" font-size="10" fill="#374151">1</text>
  <rect x="305" y="75" width="20" height="20" fill="#d1d5db" stroke="#9ca3af" rx="2"/>
  <text x="312" y="90" font-family="Arial, sans-serif" font-size="10" fill="#374151">+</text>
  <text x="340" y="90" font-family="Arial, sans-serif" font-size="10" fill="#374151">$8.99</text>
  
  <!-- Botón eliminar producto 1 -->
  <rect x="365" y="80" width="15" height="15" fill="#ef4444" stroke="#dc2626" rx="2"/>
  <text x="370" y="92" font-family="Arial, sans-serif" font-size="8" fill="white">X</text>
  
  <!-- Producto 2 -->
  <rect x="15" y="130" width="370" height="55" fill="white" stroke="#d1d5db" rx="4"/>
  <rect x="20" y="135" width="45" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="75" y="135" width="100" height="8" fill="#d1d5db" rx="2"/>
  <rect x="75" y="148" width="70" height="8" fill="#d1d5db" rx="2"/>
  <text x="75" y="170" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Ensalada César</text>
  
  <!-- Controles cantidad producto 2 -->
  <rect x="250" y="140" width="20" height="20" fill="#d1d5db" stroke="#9ca3af" rx="2"/>
  <text x="257" y="155" font-family="Arial, sans-serif" font-size="10" fill="#374151">-</text>
  <rect x="275" y="140" width="25" height="20" fill="white" stroke="#9ca3af" rx="2"/>
  <text x="285" y="155" font-family="Arial, sans-serif" font-size="10" fill="#374151">2</text>
  <rect x="305" y="140" width="20" height="20" fill="#d1d5db" stroke="#9ca3af" rx="2"/>
  <text x="312" y="155" font-family="Arial, sans-serif" font-size="10" fill="#374151">+</text>
  <text x="340" y="155" font-family="Arial, sans-serif" font-size="10" fill="#374151">$14.98</text>
  
  <!-- Botón eliminar producto 2 -->
  <rect x="365" y="145" width="15" height="15" fill="#ef4444" stroke="#dc2626" rx="2"/>
  <text x="370" y="157" font-family="Arial, sans-serif" font-size="8" fill="white">X</text>
  
  <!-- Producto 3 -->
  <rect x="15" y="195" width="370" height="55" fill="white" stroke="#d1d5db" rx="4"/>
  <rect x="20" y="200" width="45" height="45" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
  <rect x="75" y="200" width="90" height="8" fill="#d1d5db" rx="2"/>
  <rect x="75" y="213" width="60" height="8" fill="#d1d5db" rx="2"/>
  <text x="75" y="235" font-family="Arial, sans-serif" font-size="8" fill="#6b7280">Bebida (Cola)</text>
  
  <!-- Controles cantidad producto 3 -->
  <rect x="250" y="205" width="20" height="20" fill="#d1d5db" stroke="#9ca3af" rx="2"/>
  <text x="257" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">-</text>
  <rect x="275" y="205" width="25" height="20" fill="white" stroke="#9ca3af" rx="2"/>
  <text x="285" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">1</text>
  <rect x="305" y="205" width="20" height="20" fill="#d1d5db" stroke="#9ca3af" rx="2"/>
  <text x="312" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">+</text>
  <text x="340" y="220" font-family="Arial, sans-serif" font-size="10" fill="#374151">$1.50</text>
  
  <!-- Botón eliminar producto 3 -->
  <rect x="365" y="210" width="15" height="15" fill="#ef4444" stroke="#dc2626" rx="2"/>
  <text x="370" y="222" font-family="Arial, sans-serif" font-size="8" fill="white">X</text>
  
  <!-- Separador -->
  <line x1="15" y1="260" x2="385" y2="260" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Totales -->
  <text x="15" y="280" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Subtotal:</text>
  <text x="340" y="280" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">$25.47</text>
  
  <text x="15" y="300" font-family="Arial, sans-serif" font-size="11" fill="#374151" font-weight="bold">Total:</text>
  <text x="330" y="300" font-family="Arial, sans-serif" font-size="12" fill="#374151" font-weight="bold">$25.47</text>
  
  <!-- Botones de acción -->
  <rect x="15" y="315" width="175" height="30" fill="#d1d5db" stroke="#9ca3af" rx="4"/>
  <text x="55" y="335" font-family="Arial, sans-serif" font-size="9" fill="#374151">Seguir Comprando</text>
  
  <rect x="200" y="315" width="185" height="30" fill="#3b82f6" stroke="#2563eb" rx="4"/>
  <text x="235" y="335" font-family="Arial, sans-serif" font-size="9" fill="white">Continuar al Pago</text>
</svg>