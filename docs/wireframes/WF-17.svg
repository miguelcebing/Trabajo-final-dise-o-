<text x="1256" y="44" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#BFBFBF" text-anchor="end">Nuevo producto · Administrador</text>
<rect x="24" y="120" width="540" height="80" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="38" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Nombre del producto</text>
<rect x="24" y="220" width="540" height="80" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="38" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Descripción</text>
<rect x="24" y="320" width="540" height="80" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="38" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Precio</text>
<rect x="24" y="420" width="260" height="80" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="38" y="448" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Categoría</text>
<rect x="304" y="420" width="260" height="80" fill="#EFEFEF" stroke="#9E9E9E" stroke-width="1.5"/><text x="318" y="448" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#333333" text-anchor="start">Sector</text>
<rect x="592" y="120" width="308" height="260" fill="#DCDCDC" stroke="#9E9E9E" stroke-width="1.5"/><line x1="592" y1="120" x2="900" y2="380" stroke="#B5B5B5" stroke-width="1"/><line x1="900" y1="120" x2="592" y2="380" stroke="#B5B5B5" stroke-width="1"/><text x="746.0" y="244.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#444444" text-anchor="middle">Imagen del producto</text>
<rect x="592" y="420" width="308" height="90" rx="10" fill="#2B2B2B"/><text x="746.0" y="471.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GUARDAR PRODUCTO</text>
<rect x="592" y="540" width="308" height="80" rx="10" fill="#E4E4E4" stroke="#9E9E9E" stroke-width="1.5"/><text x="746.0" y="586.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Cancelar</text>
<rect x="940" y="96" width="316" height="600" fill="#FBFBFB" stroke="#CCCCCC" stroke-width="1.5"/>
<text x="958" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="start">Anotaciones (criterios CA)</text>
<circle cx="966" cy="163" r="13" fill="#2B2B2B"/>
<text x="966" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="988" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">CA-1 Campos obligatorios</text>
<text x="988" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">del producto.</text>
<circle cx="966" cy="219" r="13" fill="#2B2B2B"/>
<text x="966" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="988" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">CA-2 Categoría y sector</text>
<text x="988" y="241" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">de preparación.</text>
<circle cx="966" cy="275" r="13" fill="#2B2B2B"/>
<text x="966" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="988" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">CA-2 Guardar el producto.</text>
<circle cx="966" cy="314" r="13" fill="#2B2B2B"/>
<text x="966" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="988" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">CA-3 y CA-4 Validación</text>
<text x="988" y="336" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#444444" text-anchor="start">de precio y campos.</text>
